name: Node CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check script syntax
        run: |
          for script in scripts/*.js scripts/*.shelly.js; do
            node --check "$script"
          done
      - name: Validate manifest
        run: python3 -m json.tool scripts/manifest.json > /dev/null
      - name: Run tests
        run: node --test tests/*.test.js
